# בונה app-debug.apk בכל push ל-main (או ידנית מלשונית Actions → Run workflow).
# הגדרה חד-פעמית: Settings → Secrets and variables → Actions → Variables
#   CAP_SERVER_URL = https://your-app.vercel.app   (כתובת השרת החיה)
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: 'כתובת השרת (אופציונלי, עוקף את משתנה CAP_SERVER_URL)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAP_SERVER_URL: ${{ inputs.server_url || vars.CAP_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Sync Capacitor (מטמיע את כתובת השרת ב-APK)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
