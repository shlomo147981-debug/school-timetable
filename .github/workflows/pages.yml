# מפרסם את האפליקציה הסטטית ל-GitHub Pages בכל push ל-main:
#   https://shlomo147981-debug.github.io/school-timetable/
# אפליקציית האנדרואיד בודקת שם את version.json ומתעדכנת אוטומטית (OTA).
# הפעלה חד-פעמית: Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Static export (basePath /school-timetable)
        run: npm run build
        env:
          PAGES_BASE_PATH: /school-timetable

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
